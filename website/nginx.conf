server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css text/xml application/javascript application/json application/xml
    application/rss+xml image/svg+xml;

  # Astro fingerprints everything it emits under /_astro, so those urls never point at new
  # bytes. `expires` would emit a second, competing Cache-Control header, so this sets the one.
  location /_astro/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Pages are built as directories (/pricing/index.html), so serve the index directly instead
  # of redirecting to the trailing-slash url. The html names the current bundles, so a stale
  # copy would load bundles that no longer exist.
  location / {
    try_files $uri $uri/index.html =404;
    add_header Cache-Control "no-cache";
  }

  # The install command on /agent, `curl -fsSL https://flotilla.social/agent.sh | bash`,
  # follows this redirect (-L) to install.sh in the flotilla-agent repo. A copy served from here
  # would drift from the repo, and proxy_pass would resolve gitea's hostname at startup,
  # so a failed lookup would stop the whole site.
  location = /agent.sh {
    return 302 https://gitea.coracle.social/api/v1/repos/coracle/flotilla-agent/raw/install.sh?ref=master;
  }

  # mime.types maps .xml to text/xml. An empty types map here makes default_type apply,
  # so the feed is served as application/rss+xml.
  location = /rss.xml {
    types { }
    default_type application/rss+xml;
    add_header Cache-Control "no-cache";
  }

  error_page 404 /404.html;

  location = /404.html {
    internal;
    add_header Cache-Control "no-cache";
  }
}
