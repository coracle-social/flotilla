Builds:
  - versionName: 1.14.0
    versionCode: 59
    commit: 1.14.0
    subdir: android/app
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky nodejs npm
      - npm install -g pnpm@12.15.0
    gradle:
      - fdroid
    prebuild: ../../scripts/fdroid/prepare.sh
    scanignore:
      - node_modules
    build: ../../scripts/fdroid/build.sh

AllowedAPKSigningKeys: 6daf683e1ca83a4cd88573e9739e2aa944c85d56154e344230557cffed4ad78c

MaintainerNotes: |-
  scripts/fdroid/prepare.sh removes Firebase, Google Services, Plausible and the ACINQ
  native secp256k1 library, then installs dependencies, so it runs as prebuild ahead of
  the scanner. node_modules holds FLOSS build tools (esbuild, sharp), hence scanignore.
  Node comes from forky because the lockfile needs pnpm 11 or newer, which wants Node 22 or newer,
  and trixie ships 20. pnpm is pinned to package.json's packageManager so it doesn't
  fetch another copy of itself. Capacitor needs JDK 21, which trixie's default-jdk-headless
  provides, so the recipe installs no JDK.

  Builds are reproducible: upstream's release workflow runs this recipe in the
  buildserver-trixie image (scripts/fdroid/reproduce.sh) and publishes that apk, signed
  with the distribution key, at Binaries.

  The Reports tab entries for the microphone and the camera are expected: voice rooms,
  calls and voice notes need them.

