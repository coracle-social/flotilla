RepoType: git
Repo: https://gitea.coracle.social/coracle/flotilla.git

Builds:
  - versionName: 1.11.1
    versionCode: 53
    commit: 04bd38429e60768b21ec2c79c38438b47d97b3a2
    subdir: android/app
    sudo:
      - echo "deb https://deb.debian.org/debian trixie main" > /etc/apt/sources.list.d/trixie.list
      - apt-get update
      - apt-get install -y -t trixie openjdk-21-jdk-headless
      - update-alternatives --auto java
      - curl -Lo node.tar.xz https://nodejs.org/dist/v22.23.3/node-v22.23.3-linux-x64.tar.xz
      - echo "df450af89261115ef9f9e3830c3eeb2cc9213b63c720b1af623cb5dcbe2e02de  node.tar.xz"
        | sha256sum -c -
      - tar xJf node.tar.xz --strip-components=1 -C /usr/local/
      - rm node.tar.xz
      - corepack enable
    gradle:
      - fdroid
    prebuild: ../../scripts/fdroid/prepare.sh
    scanignore:
      - node_modules
    build: ../../scripts/fdroid/build.sh

MaintainerNotes: |-
  scripts/fdroid/prepare.sh removes Firebase, Google Services, Plausible and the ACINQ
  native secp256k1 library, then installs dependencies, so it runs as prebuild ahead of
  the scanner. node_modules holds FLOSS build tools (esbuild, sharp), hence scanignore.
  Capacitor needs JDK 21, installed from trixie, and Node comes from nodejs.org at a
  pinned checksum to match the lts/jod in .nvmrc.

AutoUpdateMode: Version
UpdateCheckMode: Tags ^[0-9]+\.[0-9]+\.[0-9]+$
UpdateCheckData: android/app/build.gradle|(?m)^\s*versionCode\s+(\d+)\s*$|.|(?m)^\s*versionName\s+"([^"]+)"\s*$
CurrentVersion: 1.11.1
CurrentVersionCode: 53
